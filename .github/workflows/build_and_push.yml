name: Build Docker Image

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The release tag reaches the served OpenAPI spec at runtime: the binary's
      # `version` var (ldflags via Dockerfile ARG VERSION) is stamped onto the
      # hand-owned spec's info.version when DocsHandler serves it. Phase 4 (#135)
      # retired the proto sources and the build-time `make generate`, so there is
      # no proto-version sed step here anymore.

      # Publishing is intentionally disabled: no 15th MEU container registry,
      # registry credentials, or deployment watcher has been configured yet.
      # The pipeline only verifies that the release builds; it must NOT push to
      # the upstream 7Cav Docker Hub repository or call the upstream watcher
      # endpoint. Re-enable push (registry login + push: true + a deploy hook)
      # once 15th MEU deployment targets are decided.
      - name: Build Docker Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            15th-meu-api:${{ github.ref_name }}
            15th-meu-api:latest
